<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSX AI Market Intelligence</title><link rel="stylesheet" href="src/styles.css"></head><body><header><div><h1>PSX AI Market Intelligence</h1><p id="dataset"></p></div><button id="refresh">Refresh Data</button></header><nav><button data-view="all" class="active">All Shares</button><button data-view="small">Small Ticket ≤ Rs50</button><button data-view="status">Model & Data</button></nav><main><section id="cards" class="cards"></section><section id="all" class="view"><div class="filters"><input id="q" placeholder="Search symbol/company"><select id="sector"><option value="">All sectors</option></select><select id="price"><option value="">All prices</option><option value="50">≤ Rs50</option><option value="10">Under Rs10</option><option value="100+">Above Rs100</option></select><select id="state"><option value="">All states</option></select><label><input id="pe" type="checkbox"> P/E ≤10</label></div><div id="count"></div><div class="table"><table><thead><tr><th>Symbol</th><th>Company</th><th>Sector</th><th>Price</th><th>Today</th><th>Lowest Value</th><th>Highest Value</th><th>Historical Pos.</th><th>P/E</th><th>30D Avg Vol</th><th>Tactical</th><th>Medium</th><th>Long</th><th>Entry Q.</th><th>Conf.</th><th>Model</th><th>Risk</th></tr></thead><tbody></tbody></table></div></section><section id="small" class="view hidden"><div id="smallgrid" class="smallgrid"></div></section><section id="status" class="view hidden"><div class="panel"><h2>Model & Data Status</h2><div id="statusgrid"></div><p><b>Integrity rule:</b> PSX-first, no Yahoo Finance. Missing values remain unavailable. Public PSX scraping is not used.</p></div></section></main><script type="module" src="src/app.js"></script></body></html>
